<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc400" />
      <stop offset="55%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="#16161a" />
  <rect x="5" y="5" width="118" height="118" rx="26" fill="url(#bg)" />

  <!-- Tab strip with one raised tab: the "new tab" metaphor. -->
  <g fill="#16161a">
    <rect x="22" y="30" width="46" height="26" rx="9" />
    <rect x="22" y="46" width="84" height="12" rx="6" />
  </g>

  <!-- Plus -->
  <g fill="#16161a">
    <rect x="58" y="70" width="12" height="36" rx="6" />
    <rect x="46" y="82" width="36" height="12" rx="6" />
  </g>
</svg>
