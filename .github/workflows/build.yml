name: Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm run test:run

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        target: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same scripts used locally, so CI can't drift from what we hand out.
      - name: Build
        run: npm run build${{ matrix.target == 'firefox' && ':firefox' || '' }}

      - name: Zip
        run: npm run zip:${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: santi.tab-${{ matrix.target }}
          path: web-ext-artifacts/*.zip
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "santi.tab-*.zip"
          generateReleaseNotes: true
          immutableCreate: true
          body: |
            ## Install

            **Firefox** — install from
            [addons.mozilla.org](https://addons.mozilla.org/firefox/addon/santi-tab/).
            The zip below is unsigned, so Firefox will only load it temporarily
            (`about:debugging` → Load Temporary Add-on); it is removed on restart.

            **Chromium** (Chrome, Edge, Brave, Arc, Vivaldi, Opera) — download
            `santi.tab-chromium-*.zip`, unzip it, open `chrome://extensions`,
            enable Developer mode, then **Load unpacked** and pick the folder.

            After installing on Firefox, grant reddit access once via
            **Menu → Data → Grant reddit.com access** — Firefox treats MV3 host
            permissions as optional, so no wallpapers load until you do.
