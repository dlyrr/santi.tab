name: Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm run test:run

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        include:
          - target: chromium
            script: build
            dir: dist
          - target: firefox
            script: build:firefox
            dir: dist-firefox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}

      - name: Zip
        run: cd ${{ matrix.dir }} && zip -r ../santi.tab-${{ matrix.target }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: santi.tab-${{ matrix.target }}
          path: santi.tab-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "santi.tab-*.zip"
          generateReleaseNotes: true
          immutableCreate: true
